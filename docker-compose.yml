services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mindo_phase1
      POSTGRES_USER: mindo
      POSTGRES_PASSWORD: mindo
    ports:
      - "5432:5432"
    volumes:
      - mindo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindo -d mindo_phase1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - mindo_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
  mindo_postgres:
  mindo_redis:

map $http_cf_connecting_ip $mindo_client_ip {
  default $http_cf_connecting_ip;
  "" $remote_addr;
}

map $http_x_forwarded_proto $mindo_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name admin-mindo.stg-studio.com;

  location / {
    proxy_pass http://admin:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $mindo_client_ip;
    proxy_set_header X-Forwarded-For $mindo_client_ip;
    proxy_set_header X-Forwarded-Proto $mindo_forwarded_proto;
  }
}

server {
  listen 80;
  server_name api-mindo.stg-studio.com;
  client_max_body_size 12m;

  location /socket.io/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $mindo_client_ip;
    proxy_set_header X-Forwarded-For $mindo_client_ip;
    proxy_set_header X-Forwarded-Proto $mindo_forwarded_proto;
  }

  location / {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $mindo_client_ip;
    proxy_set_header X-Forwarded-For $mindo_client_ip;
    proxy_set_header X-Forwarded-Proto $mindo_forwarded_proto;
  }
}

server {
  listen 80 default_server;
  server_name _;
  return 444;
}
